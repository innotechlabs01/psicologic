name: Deploy to Vercel

on:
  push:
    branches:
      - productive
  pull_request:
    branches:
      - productive

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: vercel
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .nojekyll to disable Jekyll
        run: touch .nojekyll  # Crea el archivo vacío para omitir Jekyll en Pages

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tailwind CSS (minified)
        run: pnpm build:style

      - name: Build Astro project
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          ls -la dist/  # Output real de un build SSR: client/ + server/
          if [ ! -f "dist/server/entry.mjs" ]; then
            echo "Build failed: no SSR server bundle (dist/server/entry.mjs)"
            exit 1
          fi
          if [ -z "$(ls -A dist/client)" ]; then
            echo "Build failed: dist/client is empty"
            exit 1
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.event_name == 'push' && '--prod' || '' }}
