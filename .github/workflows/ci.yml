name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  scaffold-integrity:
    name: Scaffold integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scaffold integrity checks
        run: bash scripts/check-scaffold.sh
      - name: Shellcheck workflow scripts
        run: shellcheck scripts/worktree.sh scripts/check-scaffold.sh .githooks/pre-commit

  type-check:
    name: Type check (astro check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check (0 errors required)
        run: pnpm exec astro check
